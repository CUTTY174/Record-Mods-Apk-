<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Record Mods Apk</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap">
<style>
:root{--bg:#040b18;--cy:#38bdf8;--tx:#e6f2ff;--mu:#8ba6c4;--gl:rgba(56,189,248,.07);--bd:rgba(56,189,248,.22);--glow:0 0 22px rgba(56,189,248,.45);color-scheme:dark;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--tx);font:400 15px/1.5 Sora,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background-image:radial-gradient(900px 500px at 50% -10%,rgba(56,189,248,.16),transparent 70%),radial-gradient(600px 400px at 100% 60%,rgba(14,116,144,.14),transparent 70%);background-attachment:fixed;min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:rgba(4,11,24,.85);backdrop-filter:blur(14px);z-index:10}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--cy);outline-offset:2px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:12px 20px;background:rgba(4,11,24,.72);backdrop-filter:blur(14px);border-bottom:1px solid var(--bd)}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:.2px;white-space:nowrap}
.logo{width:38px;height:38px;border-radius:50%;border:2px solid var(--cy);box-shadow:var(--glow);object-fit:cover;background:#07162b}
.links{position:fixed;left:0;right:0;bottom:0;z-index:9;display:flex;justify-content:center;gap:6px;padding:8px 12px calc(8px + env(safe-area-inset-bottom,0px));background:rgba(4,11,24,.82);backdrop-filter:blur(14px);border-top:1px solid var(--bd)}
.links svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.links button{flex:1;max-width:120px;display:flex;flex-direction:column;align-items:center;gap:3px;background:none;border:0;padding:6px 8px;border-radius:14px;color:var(--mu);font-size:12px;cursor:pointer;transition:.2s}
.links button:hover,.links button.on{color:var(--cy);background:var(--gl);text-shadow:0 0 12px var(--cy)}
.links button.on svg{filter:drop-shadow(0 0 6px var(--cy))}
.sp{flex:1}
.search{flex:0 1 260px;min-width:150px;padding:9px 16px;border-radius:999px;border:1px solid var(--bd);background:var(--gl);outline:0}
.search:focus{border-color:var(--cy);box-shadow:var(--glow)}
.btn{cursor:pointer;border:1px solid var(--cy);background:rgba(56,189,248,.14);color:var(--cy);padding:9px 18px;border-radius:999px;font-weight:600;transition:.2s}
.btn:hover{background:var(--cy);color:#02101f;box-shadow:var(--glow)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn.ghost{border-color:var(--bd);color:var(--mu);background:none}
.btn.dng:hover{background:#f87171;border-color:#f87171;box-shadow:0 0 18px rgba(248,113,113,.5)}
.hero{text-align:center;padding:56px 20px 36px}
.ring{width:176px;height:176px;margin:0 auto 26px;border-radius:50%;border:4px solid var(--cy);box-shadow:var(--glow),inset 0 0 28px rgba(56,189,248,.35),0 0 70px rgba(56,189,248,.25);padding:14px;display:grid;place-items:center}
.ring img{width:100%;height:100%;border-radius:50%;object-fit:cover}
h1{margin:0 0 12px;font-size:clamp(30px,6vw,58px);font-weight:800;letter-spacing:2px;text-shadow:0 0 14px var(--cy),0 0 40px rgba(56,189,248,.55)}
.sub{margin:0 auto 26px;max-width:520px;color:var(--mu);font-size:17px}
.hero .btn{padding:13px 30px;font-size:16px;box-shadow:var(--glow)}
.wrap{max-width:1080px;margin:0 auto;padding:0 20px 110px}
.panel{background:var(--gl);border:1px solid var(--bd);border-radius:28px;padding:24px;backdrop-filter:blur(12px);box-shadow:0 0 40px rgba(56,189,248,.07)}
.panel>h2{margin:0 0 18px;font-size:22px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
@media(max-width:900px){.grid{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){.grid{grid-template-columns:1fr}.panel{padding:16px}.sp{display:none}.search{flex:1 1 100%;order:5}}
.card{display:flex;flex-direction:column;gap:12px;padding:18px;border-radius:20px;background:rgba(10,28,52,.55);border:1px solid var(--bd);transition:.25s}
.card:hover{border-color:var(--cy);box-shadow:var(--glow);transform:translateY(-3px)}
.top{display:flex;gap:12px;align-items:center}
.top h3{margin:0;font-size:16px;line-height:1.25}
.cat{font-size:12px;color:var(--mu)}
.ic{flex:none;width:56px;height:56px;border-radius:16px;display:grid;place-items:center;font-weight:800;font-size:22px;color:#02101f;overflow:hidden}
.ic img{width:100%;height:100%;object-fit:cover}
.rt{font-size:13px;color:var(--mu)}
.st{color:#fbbf24;letter-spacing:1px}
.tag{align-self:flex-start;font-size:12px;padding:3px 10px;border-radius:999px;border:1px solid var(--bd);color:var(--cy)}
.nt{margin:0;color:var(--mu);font-size:13px;flex:1}
.card .btn{width:100%}
.empty{grid-column:1/-1;text-align:center;padding:36px 12px;color:var(--mu)}
.empty b{display:block;color:var(--tx);font-size:18px;margin-bottom:6px}
.ov{position:fixed;inset:0;z-index:20;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(2,6,14,.75);backdrop-filter:blur(6px)}
.ov.open{display:flex}
.md{width:100%;max-width:440px;max-height:92vh;overflow:auto;background:#071428;border:1px solid var(--cy);border-radius:24px;padding:24px;box-shadow:var(--glow);animation:pop .22s ease-out}
.md.wide{max-width:640px}
@keyframes pop{from{opacity:0;transform:scale(.96)}}
.md h2{margin:0 0 4px;font-size:20px}
.meta{display:flex;gap:10px;margin:14px 0}
.meta div{flex:1;padding:10px;border-radius:14px;background:var(--gl);border:1px solid var(--bd);font-size:13px;color:var(--mu)}
.meta b{display:block;color:var(--tx);font-size:15px}
.bar{height:6px;border-radius:9px;background:var(--gl);overflow:hidden;margin:14px 0 8px}
.bar i{display:block;height:100%;width:0;background:var(--cy);box-shadow:var(--glow)}
.bar.go i{width:100%;transition:width 3s linear}
.cd{text-align:center;color:var(--mu)}
.cd b{color:var(--cy);font-size:26px}
.ready{display:none;text-align:center}
.ready a{display:block;text-decoration:none;padding:12px;border-radius:999px;background:var(--cy);color:#02101f;font-weight:800;box-shadow:var(--glow);margin:6px 0}
.row{display:flex;justify-content:flex-end;gap:10px;margin-top:16px}
label{display:block;font-size:13px;color:var(--mu);margin-bottom:10px}
label input,label select,label textarea{display:block;width:100%;margin-top:4px;padding:9px 12px;border-radius:12px;border:1px solid var(--bd);background:var(--gl);outline:0}
label select option{background:#071428}
label input:focus,label select:focus,label textarea:focus{border-color:var(--cy)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:0 12px}
.err{color:#f87171;font-size:13px;min-height:18px}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--bd)}
.li span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.toast{position:fixed;left:50%;bottom:calc(88px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;pointer-events:none;z-index:30;padding:10px 20px;border-radius:999px;background:#071428;border:1px solid var(--cy);box-shadow:var(--glow);transition:.3s}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>

  <button data-c="Games"><svg viewBox="0 0 24 24"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 10v5M4.5 12.5h5"/><circle cx="16" cy="11.5" r=".8"/><circle cx="18.5" cy="14" r=".8"/></svg>Games</button>
  <button data-c="Tools"><svg viewBox="0 0 24 24"><path d="M14.7 6.3a4 4 0 0 0-5 5L3 18l3 3 6.7-6.7a4 4 0 0 0 5-5l-2.4 2.4-2.6-.6-.6-2.6z"/></svg>Tools</button>
</nav>

<script>
var FB="data:image/svg+xml,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" fill="#07162b"/><text x="50" y="68" font-size="58" font-weight="800" text-anchor="middle" fill="#38bdf8" font-family="sans-serif">R</text></svg>');
var KEY="record-apps-hub:v1",$=function(i){return document.getElementById(i)};
var seed=[
{id:"a1",name:"Snap Notes",cat:"Apps",version:"3.2.1",size:"18 MB",icon:"",notes:"Fast, clean notes with offline sync.",url:"https://example.com/snap-notes.apk",rating:4.8,dl:1240000},
{id:"a2",name:"Pixel Racer",cat:"Games",version:"1.9.0",size:"142 MB",icon:"",notes:"New tracks and a rewind-the-lap mode.",url:"https://example.com/pixel-racer.apk",rating:4.7,dl:860000},
{id:"a3",name:"QuickScan",cat:"Tools",version:"5.0.4",size:"24 MB",icon:"",notes:"Scan documents to PDF in two taps.",url:"https://example.com/quickscan.apk",rating:4.9,dl:520000},
{id:"a4",name:"Tide Weather",cat:"Apps",version:"2.8.0",size:"12 MB",icon:"",notes:"Hourly forecasts with a clear radar view.",url:"https://example.com/tide-weather.apk",rating:4.6,dl:310000},
{id:"a5",name:"Block Quest",cat:"Games",version:"0.9.7",size:"96 MB",icon:"",notes:"Build, explore and share worlds with friends.",url:"https://example.com/block-quest.apk",rating:4.5,dl:240000},
{id:"a6",name:"Battery Buddy",cat:"Tools",version:"1.4.2",size:"8 MB",icon:"",notes:"See what drains your battery and fix it.",url:"https://example.com/battery-buddy.apk",rating:4.4,dl:98000}];
function load(){try{var r=localStorage.getItem(KEY);if(r){var a=JSON.parse(r);if(Array.isArray(a))return a}}catch(e){}return seed.map(function(x){return Object.assign({},x)})}
var apps=load(),cat="All",qv="",editId=null,timer=null,delArm=null;
function save(){try{localStorage.setItem(KEY,JSON.stringify(apps))}catch(e){toast("Couldn’t save in this browser. Changes will reset when you reload.")}}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})}
function fmt(n){return n>=1e6?(n/1e6).toFixed(1).replace(".0","")+"M":n>=1e3?Math.round(n/1e3)+"K":String(n)}
function hue(s){var h=0;for(var i=0;i<s.length;i++)h=(h*31+s.charCodeAt(i))%360;return h}
function okUrl(u){try{var p=new URL(u).protocol;return p==="https:"||p==="http:"}catch(e){return false}}
function icon(a){var l=esc((a.name||"?").charAt(0).toUpperCase()),h=hue(a.id+a.name);
  return '<div class="ic" style="background:linear-gradient(135deg,hsl('+h+' 85% 65%),hsl('+(h+40)+' 80% 55%))">'+(a.icon?'<img src="'+esc(a.icon)+'" alt="'+l+'" onerror="this.replaceWith(this.alt)">':l)+'</div>'}
function toast(m){var t=$("toast");t.textContent=m;t.classList.add("on");clearTimeout(t._t);t._t=setTimeout(function(){t.classList.remove("on")},2600)}
function render(){
  var q=qv.trim().toLowerCase(),list=apps.filter(function(a){return(cat==="All"||a.cat===cat)&&(!q||(a.name+" "+a.cat+" "+a.notes).toLowerCase().indexOf(q)>-1)});
  $("ttl").textContent=cat==="All"?"Featured apps":cat;
  $("grid").innerHTML=list.length?list.map(function(a){return '<article class="card"><div class="top">'+icon(a)+'<div><h3>'+esc(a.name)+'</h3><div class="cat">'+esc(a.cat)+'</div></div></div>'
    +'<div class="rt"><span class="st" aria-label="5 star rating">★★★★★</span> '+Number(a.rating||5).toFixed(1)+' ('+fmt(a.dl||0)+' downloads)</div>'
    +'<span class="tag">v'+esc(a.version||"1.0")+'</span><p class="nt">'+esc(a.notes)+'</p><button class="btn" data-dl="'+esc(a.id)+'">Download</button></article>'}).join("")
  :'<div class="empty"><b>Nothing found</b>'+(q?'No matches for “'+esc(qv.trim())+'”. Check the spelling or try a shorter name.':'This category is empty. Add an app from the admin panel.')+'</div>'}
function openOv(i){$(i).classList.add("open")}
function closeOv(i){$(i).classList.remove("open");if(i==="dlov")clearInterval(timer)}
function openDl(id){
  var a=apps.find(function(x){return x.id===id});if(!a)return;clearInterval(timer);
  $("dlt").textContent=a.name;$("dlc").textContent=a.cat;$("dlv").textContent="v"+(a.version||"1.0");$("dls").textContent=a.size||"Unknown";
  $("ready").style.display="none";$("wait").style.display="block";$("n").textContent="3";
  var b=$("bar");b.classList.remove("go");void b.offsetWidth;b.classList.add("go");openOv("dlov");
  var n=3;timer=setInterval(function(){n--;$("n").textContent=n;if(n<=0){clearInterval(timer);reveal(a)}},1000)}
function reveal(a){
  $("wait").style.display="none";var r=$("ready"),l=$("lnk");r.style.display="block";
  if(okUrl(a.url)){l.href=a.url;l.style.display="block";r.firstElementChild.textContent="All set. Your link is ready.";a.dl=(a.dl||0)+1;save();render()}
  else{l.style.display="none";r.firstElementChild.textContent="This app doesn’t have a download link yet. Please check back soon."}}
function adminList(){
  $("list").innerHTML=apps.length?apps.map(function(a){return '<div class="li"><span><b>'+esc(a.name)+'</b> <small class="cat">'+esc(a.cat)+' v'+esc(a.version)+'</small></span><button class="btn ghost sm" data-ed="'+esc(a.id)+'">Edit</button><button class="btn ghost sm dng" data-rm="'+esc(a.id)+'">'+(delArm===a.id?"Tap again to delete":"Delete")+'</button></div>'}).join("")
  :'<div class="empty"><b>No apps yet</b>Fill in the form above to add your first one.</div>'}
function resetForm(){editId=null;$("f").reset();$("err").textContent="";$("sv").textContent="Add app";$("cn").hidden=true}
function fillForm(a){editId=a.id;$("fn").value=a.name;$("fc").value=a.cat;$("fv").value=a.version||"";$("fs").value=a.size||"";$("fi").value=a.icon||"";$("fr").value=a.notes||"";$("fu").value=a.url||"";$("sv").textContent="Save changes";$("cn").hidden=false;$("fn").focus()}
$("f").addEventListener("submit",function(e){e.preventDefault();
  var n=$("fn").value.trim(),u=$("fu").value.trim();
  if(!n){$("err").textContent="Add an app name to continue.";return}
  if(!okUrl(u)){$("err").textContent="Enter a full download link that starts with https://";return}
  var d={name:n,cat:$("fc").value,version:$("fv").value.trim()||"1.0.0",size:$("fs").value.trim(),icon:$("fi").value.trim(),notes:$("fr").value.trim(),url:u};
  if(editId){var a=apps.find(function(x){return x.id===editId});Object.assign(a,d);toast("Changes saved")}
  else{apps.unshift(Object.assign({id:"a"+Date.now(),rating:5,dl:0},d));toast("App added")}
  save();resetForm();render();adminList()});
$("cn").onclick=resetForm;
document.addEventListener("click",function(e){var t=e.target.closest("button");if(!t)return;
  if(t.dataset.dl)openDl(t.dataset.dl);
  else if(t.dataset.x)closeOv(t.dataset.x);
  else if(t.dataset.ed){fillForm(apps.find(function(x){return x.id===t.dataset.ed}))}
  else if(t.dataset.rm){var id=t.dataset.rm;if(delArm===id){apps=apps.filter(function(x){return x.id!==id});delArm=null;if(editId===id)resetForm();save();render();toast("App deleted")}else delArm=id;adminList()}
  else if(t.dataset.c){cat=t.dataset.c;document.querySelectorAll("#links button").forEach(function(b){b.classList.toggle("on",b===t)});render()}});
document.querySelectorAll(".ov").forEach(function(o){o.addEventListener("click",function(e){if(e.target===o)closeOv(o.id)})});
document.addEventListener("keydown",function(e){if(e.key==="Escape")document.querySelectorAll(".ov.open").forEach(function(o){closeOv(o.id)})});
$("q").addEventListener("input",function(e){qv=e.target.value;render()});
$("adm").onclick=function(){delArm=null;adminList();openOv("adov")};
$("exp").onclick=function(){$("feat").scrollIntoView({behavior:"smooth"})};
render();
</script>
</body>
</html>
